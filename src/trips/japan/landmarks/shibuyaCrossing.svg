<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
	<!-- The scramble seen from the station side: zebra crossings on all four sides plus the two diagonals, people
	     mid-crossing, and the buildings that frame it: QFRONT's giant screen, a screen-covered corner building and
	     Shibuya Scramble Square rising behind. -->
	<defs>
		<radialGradient id="groundShadow">
			<stop offset="0" stop-color="#1D2433" stop-opacity=".3"/>
			<stop offset="1" stop-color="#1D2433" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="road" x1="0" x2="0" y1="0" y2="1">
			<stop offset="0" stop-color="#5D6573"/>
			<stop offset="1" stop-color="#454C58"/>
		</linearGradient>
		<linearGradient id="towerGlass" x1="0" x2="1" y1="0" y2="0">
			<stop offset="0" stop-color="#B9D3E8"/>
			<stop offset=".55" stop-color="#7FA6C6"/>
			<stop offset="1" stop-color="#55799A"/>
		</linearGradient>
		<linearGradient id="qfrontGlass" x1="0" x2="1" y1="0" y2="0">
			<stop offset="0" stop-color="#4E6478"/>
			<stop offset="1" stop-color="#2F3F50"/>
		</linearGradient>
		<linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
			<stop offset="0" stop-color="#FF6FA8"/>
			<stop offset=".5" stop-color="#FFB25B"/>
			<stop offset="1" stop-color="#59C9F0"/>
		</linearGradient>
		<linearGradient id="beigeBlock" x1="0" x2="1" y1="0" y2="0">
			<stop offset="0" stop-color="#ECE3D2"/>
			<stop offset="1" stop-color="#C9BCA4"/>
		</linearGradient>
		<clipPath id="roadArea"><path d="M4 119H124L108 85H20Z"/></clipPath>
	</defs>

	<ellipse cx="64" cy="120" rx="62" ry="5" fill="url(#groundShadow)"/>

	<path d="M94 84V12L101 6H114V84Z" fill="url(#towerGlass)" stroke="#3E5C78" stroke-width=".9" stroke-linejoin="round"/>
	<path d="M98 18H114M98 30H114M98 42H114M98 54H114M98 66H114M104 8V84" stroke="#E6F1FA" stroke-opacity=".6" stroke-width=".7"/>
	<rect x="98" y="6" width="12" height="3" fill="#E6F1FA" opacity=".8"/>

	<path d="M72 84V36H104V84Z" fill="url(#beigeBlock)" stroke="#8E8270" stroke-width=".8"/>
	<rect x="76" y="40" width="24" height="12" rx="1" fill="#2B2F38"/>
	<rect x="77.2" y="41.2" width="21.6" height="9.6" rx=".6" fill="#7AD3C2"/>
	<path d="M80 46H95M80 48.5H90" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
	<rect x="76" y="56" width="11" height="14" rx="1" fill="#2B2F38"/>
	<rect x="77" y="57" width="9" height="12" fill="#F7D046"/>
	<g fill="#8E8270"><rect x="90" y="57" width="10" height="2"/><rect x="90" y="62" width="10" height="2"/><rect x="90" y="67" width="10" height="2"/><rect x="76" y="74" width="24" height="2"/></g>

	<path d="M8 84V48H30V84Z" fill="url(#beigeBlock)" stroke="#8E8270" stroke-width=".8"/>
	<rect x="11" y="52" width="16" height="10" rx="1" fill="#2B2F38"/>
	<rect x="12" y="53" width="14" height="8" fill="#9B7BEA"/>
	<g fill="#8E8270"><rect x="11" y="66" width="16" height="2"/><rect x="11" y="71" width="16" height="2"/><rect x="11" y="76" width="16" height="2"/></g>

	<path d="M28 84V26Q28 18 36 18H70V84Z" fill="url(#qfrontGlass)" stroke="#1F2A36" stroke-width=".9" stroke-linejoin="round"/>
	<path d="M31 24Q31.5 21 35 21H67V58H31Z" fill="#14181E"/>
	<path d="M32.6 24.6Q33 22.6 35.6 22.6H65.4V56.4H32.6Z" fill="url(#screen)"/>
	<path d="M37 30Q49 46 62 33" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/>
	<circle cx="58" cy="47" r="4.5" fill="#FFFFFF" opacity=".55"/>
	<path d="M30 62H70M30 68H70M30 74H70M40 58V84M50 58V84M60 58V84" stroke="#8FA6BC" stroke-opacity=".55" stroke-width=".7"/>
	<rect x="28" y="78" width="42" height="6" fill="#E8E2D6"/>
	<rect x="43" y="79" width="12" height="4" rx="1" fill="#3D8A5A"/>

	<path d="M4 119H124L108 85H20Z" fill="url(#road)"/>
	<path d="M20 85H108" stroke="#D3D7DE" stroke-width="2"/>
	<g clip-path="url(#roadArea)" stroke="#F4F6F8" fill="none">
		<path d="M28 89.5H100" stroke-width="5" stroke-dasharray="2.2 2"/>
		<path d="M10 113H118" stroke-width="7.5" stroke-dasharray="3.4 3"/>
		<path d="M17 108 25.5 91" stroke-width="6" stroke-dasharray="2.4 2.2"/>
		<path d="M111 108 102.5 91" stroke-width="6" stroke-dasharray="2.4 2.2"/>
		<path d="M33 94.5 95 107.5" stroke-width="3.6" stroke-dasharray="1.8 2.6" opacity=".8"/>
		<path d="M95 94.5 33 107.5" stroke-width="3.6" stroke-dasharray="1.8 2.6" opacity=".8"/>
	</g>

	<g>
		<circle cx="42" cy="96.6" r="1.7" fill="#E64980"/><circle cx="50" cy="98.4" r="1.7" fill="#1C7ED6"/>
		<circle cx="86" cy="96.6" r="1.7" fill="#7950F2"/><circle cx="76" cy="103.4" r="1.7" fill="#12B886"/>
		<circle cx="24" cy="112" r="1.9" fill="#F59F00"/><circle cx="40" cy="114" r="1.9" fill="#2B2F38"/>
		<circle cx="88" cy="113" r="1.9" fill="#1C7ED6"/><circle cx="104" cy="111" r="1.9" fill="#E64980"/>
		<circle cx="48" cy="89" r="1.4" fill="#2B2F38"/><circle cx="82" cy="89.5" r="1.4" fill="#12B886"/>
	</g>
</svg>
