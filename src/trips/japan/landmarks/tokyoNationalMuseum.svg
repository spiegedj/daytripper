<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
	<!-- The Honkan: a long two-storey hall in the Imperial Crown style, a heavy dark tiled roof on a western-style
	     body, with a raised central pavilion and a porte-cochère over the entrance. -->
	<defs>
		<radialGradient id="groundShadow">
			<stop offset="0" stop-color="#1D2433" stop-opacity=".32"/>
			<stop offset="1" stop-color="#1D2433" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="wall" x1="0" x2="0" y1="0" y2="1">
			<stop offset="0" stop-color="#D9C3A0"/>
			<stop offset="1" stop-color="#BFA47E"/>
		</linearGradient>
		<linearGradient id="pavilionWall" x1="0" x2="1" y1="0" y2="0">
			<stop offset="0" stop-color="#E3CEAB"/>
			<stop offset="1" stop-color="#C2A782"/>
		</linearGradient>
		<linearGradient id="roof" x1="0" x2="0" y1="0" y2="1">
			<stop offset="0" stop-color="#5A626B"/>
			<stop offset="1" stop-color="#2E343B"/>
		</linearGradient>
		<linearGradient id="window" x1="0" x2="0" y1="0" y2="1">
			<stop offset="0" stop-color="#3E4E5E"/>
			<stop offset="1" stop-color="#26313C"/>
		</linearGradient>
		<linearGradient id="stone" x1="0" x2="0" y1="0" y2="1">
			<stop offset="0" stop-color="#9A8D7A"/>
			<stop offset="1" stop-color="#7C705F"/>
		</linearGradient>
		<pattern id="wingWindows" width="7" height="30" patternUnits="userSpaceOnUse" x="1.5">
			<rect x="1.4" y="0" width="3.2" height="9" rx=".6" fill="url(#window)"/>
			<rect x="1.4" y="16" width="3.2" height="10" rx=".6" fill="url(#window)"/>
		</pattern>
	</defs>

	<ellipse cx="64" cy="119" rx="62" ry="6" fill="url(#groundShadow)"/>

	<rect x="8" y="75" width="112" height="38" fill="url(#wall)" stroke="#8C7356" stroke-width=".8"/>
	<rect x="8" y="80" width="112" height="30" fill="url(#wingWindows)"/>
	<path d="M8 93H120" stroke="#A88C68" stroke-width="1.2"/>
	<rect x="6" y="110" width="116" height="6" fill="url(#stone)"/>

	<path d="M2 76Q24 72.5 30 61H98Q104 72.5 126 76Z" fill="url(#roof)" stroke="#20252B" stroke-width=".9" stroke-linejoin="round"/>
	<path d="M3.5 75.4Q24 72 29.6 62" fill="none" stroke="#8D96A1" stroke-width=".9" stroke-linecap="round"/>
	<path d="M30 61H98" stroke="#20252B" stroke-width="1.6" stroke-linecap="round"/>

	<rect x="42" y="64" width="44" height="49" fill="url(#pavilionWall)" stroke="#8C7356" stroke-width=".8"/>
	<g fill="url(#window)">
		<rect x="46" y="70" width="3.4" height="10" rx=".6"/><rect x="52.5" y="70" width="3.4" height="10" rx=".6"/>
		<rect x="72" y="70" width="3.4" height="10" rx=".6"/><rect x="78.5" y="70" width="3.4" height="10" rx=".6"/>
	</g>
	<path d="M42 84H86" stroke="#A88C68" stroke-width="1.2"/>

	<path d="M34 66Q46 62.5 50 50H78Q82 62.5 94 66Z" fill="url(#roof)" stroke="#20252B" stroke-width=".9" stroke-linejoin="round"/>
	<path d="M50 50 56 38H72L78 50Z" fill="url(#roof)" stroke="#20252B" stroke-width=".9" stroke-linejoin="round"/>
	<path d="M57.5 50 64 40.5 70.5 50Z" fill="#E6D3B2" stroke="#20252B" stroke-width=".9" stroke-linejoin="round"/>
	<path d="M55 50.5 64 38.6 73 50.5" fill="none" stroke="#20252B" stroke-width="1.8" stroke-linejoin="round"/>
	<circle cx="64" cy="46" r="1.6" fill="#C9A227"/>
	<path d="M55 38H73" stroke="#20252B" stroke-width="1.6" stroke-linecap="round"/>
	<path d="M35.5 65.4Q46 62 49.6 51" fill="none" stroke="#8D96A1" stroke-width=".9" stroke-linecap="round"/>

	<path d="M53 113V93H75V113Z" fill="url(#pavilionWall)" stroke="#8C7356" stroke-width=".8"/>
	<path d="M51 93H77L75 89H53Z" fill="url(#roof)" stroke="#20252B" stroke-width=".8" stroke-linejoin="round"/>
	<path d="M58.5 113V102A5.5 5.5 0 0 1 69.5 102V113Z" fill="#3A2E24"/>
	<rect x="54.5" y="96" width="2.4" height="17" fill="#CBB18A"/>
	<rect x="71.1" y="96" width="2.4" height="17" fill="#CBB18A"/>
	<path d="M50 116H78L76.5 113H51.5Z" fill="#B4A893" stroke="#7C705F" stroke-width=".6"/>
</svg>
