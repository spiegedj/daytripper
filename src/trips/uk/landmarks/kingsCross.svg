	<path d="M69 92V74A21 21 0 0 1 111 74V92Z" fill="#A98853" stroke="#8A6C3E" stroke-width=".8"/>
	<path d="M21 90V74A17 17 0 0 1 55 74V90Z" fill="url(#glass)"/>
	<path d="M73 90V74A17 17 0 0 1 107 74V90Z" fill="url(#glass)"/>
	<path d="M38 57V90M29.5 59.3V90M46.5 59.3V90M21 74H55M23 66H53" fill="none" stroke="#DCE6EE" stroke-width=".8"/>
	<path d="M90 57V90M81.5 59.3V90M98.5 59.3V90M73 74H107M75 66H105" fill="none" stroke="#DCE6EE" stroke-width=".8"/>

	<!-- Ground-floor arcade. -->
	<path d="M12 96H116" stroke="#8A6C3E" stroke-width=".8"/>
	<path d="M18 116V105A4 4 0 0 1 26 105V116Z" fill="#4C3E2C"/><path d="M32 116V105A4 4 0 0 1 40 105V116Z" fill="#4C3E2C"/><path d="M46 116V105A4 4 0 0 1 54 105V116Z" fill="#4C3E2C"/>
	<path d="M74 116V105A4 4 0 0 1 82 105V116Z" fill="#4C3E2C"/><path d="M88 116V105A4 4 0 0 1 96 105V116Z" fill="#4C3E2C"/><path d="M102 116V105A4 4 0 0 1 110 105V116Z" fill="#4C3E2C"/>

	<!-- Central pier and clock tower. -->
	<rect x="58" y="22" width="12" height="94" fill="url(#brick)" stroke="#8A6C3E" stroke-width=".9"/>
	<path d="M61 116V104A3 3 0 0 1 67 104V116Z" fill="#4C3E2C"/>
	<rect x="56.5" y="22" width="15" height="4" fill="#E8CD98" stroke="#8A6C3E" stroke-width=".7"/>
	<circle cx="64" cy="34" r="4.6" fill="#F8F3E6" stroke="#3E4650" stroke-width=".8"/>
	<path d="M64 34V31M64 34H66.4" stroke="#2A3038" stroke-width=".8" stroke-linecap="round"/>
	<path d="M61 46V41A3 3 0 0 1 67 41V46Z" fill="#4C3E2C"/>
	<path d="M56.5 22 64 11 71.5 22Z" fill="url(#slate)" stroke="#3E4650" stroke-width=".8" stroke-linejoin="round"/>
	<path d="M64 11V5" stroke="#3E4650" stroke-width="1"/>
	<circle cx="64" cy="4.6" r="1.2" fill="#C8A04A"/>

	<path d="M8 119H120L118 116H10Z" fill="#AD8A52"/>
</svg>
