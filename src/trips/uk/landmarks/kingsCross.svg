<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
	<defs>
		<radialGradient id="groundShadow"><stop offset="0" stop-color="#1D2433" stop-opacity=".32"/><stop offset="1" stop-color="#1D2433" stop-opacity="0"/></radialGradient>
		<linearGradient id="brick" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#E8CD98"/><stop offset="0.50" stop-color="#D2B074"/><stop offset="1.00" stop-color="#AD8A52"/></linearGradient>
		<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0.00" stop-color="#9FB6C8"/><stop offset="1.00" stop-color="#5D7286"/></linearGradient>
		<linearGradient id="slate" x1="0" y1="0" x2="0" y2="1"><stop offset="0.00" stop-color="#7D8894"/><stop offset="1.00" stop-color="#55606C"/></linearGradient>
	</defs>
	<ellipse cx="64" cy="119" rx="52" ry="5.5" fill="url(#groundShadow)"/>

	<!-- The twin train-shed bays of the 1852 front, each filled by a great arched window. -->
